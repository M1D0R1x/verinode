[project]
name = "verinode-index-service"
version = "0.1.0"
description = "Verinode Market Data & Index Calculation Service (Separated Trust Domain)"
authors = [{ name = "Verinode Engineering", email = "engineering@verinode.io" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "cryptography>=42.0.0",
    "psycopg[binary]>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
